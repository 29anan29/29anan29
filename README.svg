<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <!-- 点阵图案定义（整齐的纸状小点点） -->
  <defs>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.6" fill="#d0d0d0" />
    </pattern>

    <!-- 圆角矩形裁剪，让点阵只在卡片内部显示 -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1600" height="900" rx="60" ry="60" />
    </clipPath>
  </defs>

  <!-- 白色圆角背景 -->
  <rect x="0" y="0" width="1600" height="900" rx="60" ry="60" fill="#ffffff" stroke="#f0f0f0" stroke-width="2" />

  <!-- 点阵图层（铺满圆角卡片内部） -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#dots)" clip-path="url(#cardClip)" />

  <!-- 上方主标题：Hello（无衬线斜体，视觉重心左移约 8px 补偿倾斜） -->
  <text
    x="792"
    y="440"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-style="italic"
    font-weight="500"
    font-size="180"
    fill="#000000"
    text-anchor="middle"
    dominant-baseline="middle">
    Hello
  </text>

  <!-- 下方小字：I'm 29anan29（衬线字体，灰色，I 大写） -->
  <text
    x="800"
    y="560"
    font-family="'Times New Roman', Times, serif"
    font-size="40"
    fill="#888888"
    text-anchor="middle"
    dominant-baseline="middle">
    I'm 29anan29
  </text>

  <!-- 最下方邮箱：anwang13@outlook.com（无衬线字体，灰色） -->
  <text
    x="800"
    y="803"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26"
    fill="#888888"
    text-anchor="middle"
    dominant-baseline="middle">
    anwang13@outlook.com
  </text>
</svg>
