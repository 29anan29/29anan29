<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>29anan29 · Profile</title>
<style>
  :root{
    --accent:#00ADD8;
    --accent-deep:#007d9c;
    --text:#e6edf3;
    --text-soft:#c9d1d9;
    --muted:#8b949e;
    --line:rgba(255,255,255,.08);
    --surface:rgba(255,255,255,.03);
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    padding:48px 20px 72px;
    min-height:100vh;
    background:#0d1117;
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* 背景光晕 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(620px circle at 12% -5%,  rgba(0,173,216,.20), transparent 62%),
      radial-gradient(760px circle at 92% 105%, rgba(0,173,216,.12), transparent 62%),
      radial-gradient(500px circle at 50% 50%, rgba(255,255,255,.02), transparent 70%);
  }

  /* 主卡片 */
  .card{
    position:relative;
    width:100%;
    max-width:840px;
    padding:44px 42px 48px;
    background:rgba(22,27,34,.78);
    border:1px solid var(--line);
    border-radius:26px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:
      0 28px 70px -24px rgba(0,0,0,.85),
      0 0 0 1px rgba(0,173,216,.06),
      inset 0 1px 0 rgba(255,255,255,.05);
    animation:rise .85s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(20px); }
    to  { opacity:1; transform:translateY(0); }
  }

  /* 顶部区域 */
  .header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    text-align:center;
  }

  .typing{
    display:block;
    width:100%;
    max-width:660px;
    height:auto;
  }

  .views{
    display:inline-block;
    border-radius:999px;
    opacity:.85;
    transition:opacity .3s ease, transform .3s ease;
  }
  .views:hover{
    opacity:1;
    transform:translateY(-2px);
  }

  /* 渐变分割线 */
  .divider{
    height:1px;
    margin:38px 0;
    border:0;
    background:linear-gradient(90deg, transparent, rgba(0,173,216,.55), rgba(0,173,216,.15), transparent);
  }

  /* 小节标题 */
  .section-title{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 20px;
    font-size:1.12rem;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--text);
  }
  .section-title::before{
    content:"";
    width:4px;
    height:20px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--accent), var(--accent-deep));
    box-shadow:0 0 14px rgba(0,173,216,.75);
  }

  /* 关于我 */
  .about p{
    margin:0 0 10px;
    line-height:1.95;
    color:var(--text-soft);
    font-size:.98rem;
  }
  .about p:last-child{
    margin-bottom:0;
    color:var(--muted);
    font-size:.92rem;
  }

  /* 信息卡 */
  .info{
    list-style:none;
    margin:26px 0 0;
    padding:0;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
    gap:12px;
  }

  .info li{
    display:flex;
    flex-direction:column;
    gap:7px;
    padding:15px 17px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:15px;
    transition:transform .28s ease, border-color .28s ease, background .28s ease, box-shadow .28s ease;
  }

  .info li:hover{
    transform:translateY(-3px);
    background:rgba(0,173,216,.07);
    border-color:rgba(0,173,216,.5);
    box-shadow:0 12px 26px -14px rgba(0,173,216,.85);
  }

  .info .label{
    font-size:.72rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .info .value{
    font-weight:600;
    font-size:.98rem;
    color:var(--text);
    word-break:break-all;
  }

  .info .value a{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px dashed rgba(0,173,216,.5);
    transition:color .25s ease, border-color .25s ease;
  }
  .info .value a:hover{
    color:#4fd1f5;
    border-bottom-color:#4fd1f5;
  }

  /* skills 标签 */
  .skills-label{
    display:block;
    margin:0 0 18px;
    font-size:.74rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }

  /* 技能图标 */
  .skills{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
  }

  .skills a{
    display:grid;
    place-items:center;
    width:74px;
    height:74px;
    border-radius:19px;
    background:var(--surface);
    border:1px solid var(--line);
    transition:transform .3s cubic-bezier(.2,.7,.3,1),
               border-color .3s ease,
               box-shadow .3s ease,
               background .3s ease;
  }

  .skills a:hover{
    transform:translateY(-7px) scale(1.07);
    background:rgba(0,173,216,.09);
    border-color:rgba(0,173,216,.55);
    box-shadow:0 16px 32px -12px rgba(0,173,216,.7);
  }

  .skills img{
    display:block;
    width:44px;
    height:44px;
  }

  /* Rust 图标在深色背景下的可见性处理 */
  .skills img[alt="Rust"]{
    filter:invert(1) drop-shadow(0 0 6px rgba(255,255,255,.12));
  }

  /* 引用 */
  .quote{
    margin:0;
    padding:22px 26px;
    border-left:3px solid var(--accent);
    border-radius:0 16px 16px 0;
    background:linear-gradient(90deg, rgba(0,173,216,.11), rgba(0,173,216,0) 78%);
    color:var(--text-soft);
    font-style:italic;
    line-height:1.9;
    font-size:1rem;
  }

  .quote cite{
    display:block;
    margin-top:12px;
    font-style:normal;
    font-size:.88rem;
    letter-spacing:.03em;
    color:var(--muted);
  }

  /* 响应式 */
  @media (max-width:600px){
    body{ padding:26px 14px 48px; }
    .card{ padding:32px 22px 36px; border-radius:20px; }
    .divider{ margin:28px 0; }
    .skills{ gap:12px; }
    .skills a{ width:64px; height:64px; border-radius:16px; }
    .skills img{ width:38px; height:38px; }
    .info{ grid-template-columns:1fr; }
  }
</style>
</head>
